<!DOCTYPE html>

    <style>
        .mode-block { transition: transform 0.2s ease-in-out; }
        .mode-block:hover { transform: translateY(-2px); }
        .color-Train { background-color: #22c55e; } /* Green */
        .color-Local { background-color: #22c55e; } /* Green */
        .color-Metro { background-color: #3b82f6; } /* Blue */
        .color-Auto { background-color: #eab308; } /* Yellow */
        .color-Taxi { background-color: #eab308; } /* Yellow */
        .color-Bus { background-color: #ef4444; } /* Red */
        .color-Walking { background-color: #94a3b8; } /* Slate */
        
        /* Authentic Google Maps cartography */
        .leaflet-tile-pane {
            filter: contrast(102%) brightness(98%);
        }
        
        .station-pin {
            transition: transform 0.2s ease;
        }
        .station-pin:hover {
            transform: scale(1.3);
            z-index: 999 !important;
        }
        
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }

        // Substring keyword highlighter
        function highlightMatch(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, `<span class="text-cyan-400 font-black underline decoration-cyan-500/60">$1</span>`);
        }

            function filterLocations(query) {
                const q = query.trim().toLowerCase();
                if (!q) {
                    const popular = isOrigin 
                        ? ["Bandra", "Andheri", "Marine Lines", "Dadar (Western)", "Borivali", "Thane", "CSMT (CST)"]
                        : ["Bandra Kurla Complex (BKC)", "CSMT (CST)", "Churchgate", "Lower Parel", "Powai (Hiranandani)", "Borivali", "Andheri"];
                    const matches = MUMBAI_LOCATIONS.filter(l => popular.includes(l.name));
                    renderDropdown(matches, '');
                    return;
                }
                
                const matches = MUMBAI_LOCATIONS.filter(loc => {
                    return loc.name.toLowerCase().includes(q) ||
                           loc.category.toLowerCase().includes(q) ||
                           loc.line.toLowerCase().includes(q) ||
                           (loc.keywords && loc.keywords.toLowerCase().includes(q));
                }).slice(0, 15);
                
                renderDropdown(matches, q);
            }

            input.addEventListener('input', () => {
                if (input.value.trim().length > 0) {
                    if (clearBtn) clearBtn.classList.remove('hidden');
                } else {
                    if (clearBtn) clearBtn.classList.add('hidden');
                }
                filterLocations(input.value);
            });

            input.addEventListener('focus', () => {
                filterLocations(input.value);
            });

            if (clearBtn) {
                clearBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    input.value = '';
                    clearBtn.classList.add('hidden');
                    input.focus();
                    filterLocations('');
                });
            }
        }

        // Live Geolocation Detector
        function detectCurrentLocation() {
            const originInput = document.getElementById('origin');
            const clearBtn = document.getElementById('clearOriginBtn');
            const locBtn = document.getElementById('useCurrentLocationBtn');
            if (!locBtn) return;
            const originalBtnHtml = locBtn.innerHTML;
            
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            locBtn.innerHTML = `<span class="inline-block w-2.5 h-2.5 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></span> Locating...`;
            locBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    let nearest = null;
                    let minDist = Infinity;
                    MUMBAI_LOCATIONS.forEach(loc => {
                        const d = Math.hypot(loc.lat - lat, loc.lon - lon);
                        if (d < minDist) {
                            minDist = d;
                            nearest = loc;
                        }
                    });

                    let locLabel = "Current Location";
                    if (nearest && minDist < 0.05) {
                        locLabel = `${nearest.name} (Current Location)`;
                    }

                    originInput.value = locLabel;
                    if (clearBtn) clearBtn.classList.remove('hidden');

                    if (userLocationMarker) map.removeLayer(userLocationMarker);
                    
                    const gpsIcon = L.divIcon({
                        className: 'gps-marker',
                        html: `
                            <div class="relative flex items-center justify-center w-6 h-6">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-cyan-500 border-2 border-white shadow-lg"></span>
                            </div>
                        `,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });

                    userLocationMarker = L.marker([lat, lon], { icon: gpsIcon }).addTo(map)
                        .bindPopup(`<b>📍 Your Location</b><br>${locLabel}`)
                        .openPopup();

                    map.flyTo([lat, lon], 14);

                    locBtn.innerHTML = originalBtnHtml;
                    locBtn.disabled = false;

                    const destInput = document.getElementById('destination');
                    if (!destInput.value) destInput.focus();
                },
                (error) => {
                    console.warn("Geolocation error:", error);
                    locBtn.innerHTML = originalBtnHtml;
                    locBtn.disabled = false;
                    alert("Could not detect location. Please select or type your location manually.");
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        // High-speed Geocoding: Instant local database lookup first, Nominatim fallback
        async function getCoordinates(locationStr) {
            if (!locationStr) return null;
            const norm = locationStr.trim().toLowerCase();
            
            // 1. Instant local match
            const localMatch = MUMBAI_LOCATIONS.find(loc => {
                const nameLower = loc.name.toLowerCase();
                return nameLower === norm || 
                       norm.includes(nameLower) || 
                       nameLower.includes(norm.replace(' (current location)', ''));
            });
            if (localMatch) return [localMatch.lat, localMatch.lon];

            // 2. Nominatim fallback
            try {
                const cleanQuery = locationStr.replace(' (Current Location)', '');
                const query = encodeURIComponent(cleanQuery + ", Mumbai, Maharashtra, India");
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`);
                const data = await res.json();
                if (data && data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
            } catch (e) { console.error("Geocoding failed", e); }
            return null;
        }

            if (mode.includes('Taxi') || mode.includes('Auto') || mode.includes('Uber')) return '#eab308'; // Yellow for Cab/Taxi
            if (mode.includes('Bus')) return '#b91c1c'; // Deep Red for BEST Bus
            if (mode.includes('Walk')) return '#94a3b8'; // Slate for Walking
            return '#2563eb';
        }

        function findStationIndex(corridor, query) {
            const q = query.toLowerCase().replace(' (current location)', '').trim();
            return corridor.findIndex(s => {
                const sLower = s.toLowerCase();
                return sLower === q || sLower.startsWith(q) || q.startsWith(sLower);
            });
        }

        function getStationCoords(name) {
            const q = name.toLowerCase().trim();
            if (RAILWAY_STATION_COORDS[q]) return RAILWAY_STATION_COORDS[q];
            const loc = MUMBAI_LOCATIONS.find(l => l.name.toLowerCase() === q);
            return loc ? [loc.lat, loc.lon] : null;
        }

        function calcGeoDistance(c1, c2) {
            const R = 6371; // Earth radius in km
            const dLat = (c2[0] - c1[0]) * Math.PI / 180;
            const dLon = (c2[1] - c1[1]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calculatePathKm(path) {
            let total = 0;
            for (let i = 0; i < path.length - 1; i++) {
                total += calcGeoDistance(path[i], path[i+1]);
            }
            return parseFloat(total.toFixed(1));
        }

        // Helper to extract continuous station coordinate sequence
        function buildStationSlice(corridor, startIdx, endIdx) {
            const path = [];
            const step = startIdx <= endIdx ? 1 : -1;
            for (let i = startIdx; i !== endIdx + step; i += step) {
                const c = getStationCoords(corridor[i]);
                if (c) path.push(c);
            }
            return path;
        }

        // Builds true Mumbai Railway corridor track path across ALL corridors (NO Bhiwandi detours!)
        function buildRealRailwayPath(origin, destination, originCoords, destCoords) {
            const cIdxOrig = findStationIndex(CENTRAL_CORRIDOR_NAMES, origin);
            const wIdxOrig = findStationIndex(WESTERN_CORRIDOR_NAMES, origin);
            const hIdxOrig = findStationIndex(HARBOUR_CORRIDOR_NAMES, origin);

            const cIdxDest = findStationIndex(CENTRAL_CORRIDOR_NAMES, destination);
            const wIdxDest = findStationIndex(WESTERN_CORRIDOR_NAMES, destination);
            const hIdxDest = findStationIndex(HARBOUR_CORRIDOR_NAMES, destination);

            const origLower = origin.toLowerCase();
            const destLower = destination.toLowerCase();

            const isDestSouth = destLower.includes('marine') || destLower.includes('churchgate') || 
                                destLower.includes('csmt') || destLower.includes('colaba') || 
                                destLower.includes('fort') || destLower.includes('nariman');

            const isDestBKC = destLower.includes('bkc') || destLower.includes('bandra kurla');
            const isDestPowai = destLower.includes('powai') || destLower.includes('hiranandani');
            const isDestAirport = destLower.includes('airport');

            const dadarCIdx = findStationIndex(CENTRAL_CORRIDOR_NAMES, "Dadar (Central)");
            const dadarWIdx = findStationIndex(WESTERN_CORRIDOR_NAMES, "Dadar (Western)");
            const csmtCIdx = findStationIndex(CENTRAL_CORRIDOR_NAMES, "CSMT (CST)");
            const csmtHIdx = findStationIndex(HARBOUR_CORRIDOR_NAMES, "CSMT (CST)");
            const churchgateWIdx = findStationIndex(WESTERN_CORRIDOR_NAMES, "Churchgate");
            const ghatCIdx = findStationIndex(CENTRAL_CORRIDOR_NAMES, "Ghatkopar");
            const andheriWIdx = findStationIndex(WESTERN_CORRIDOR_NAMES, "Andheri");
            const kurlaCIdx = findStationIndex(CENTRAL_CORRIDOR_NAMES, "Kurla");
            const kurlaHIdx = findStationIndex(HARBOUR_CORRIDOR_NAMES, "Kurla");
            const bandraWIdx = findStationIndex(WESTERN_CORRIDOR_NAMES, "Bandra");
            const kanjurCIdx = findStationIndex(CENTRAL_CORRIDOR_NAMES, "Kanjurmarg");
            const santacruzWIdx = findStationIndex(WESTERN_CORRIDOR_NAMES, "Santacruz");

            // 1. SAME WESTERN LINE (e.g. Borivali to Churchgate / Marine Lines)
            if (wIdxOrig !== -1 && wIdxDest !== -1) {
                return [buildStationSlice(WESTERN_CORRIDOR_NAMES, wIdxOrig, wIdxDest)];
            }

            // 2. SAME CENTRAL LINE (e.g. Kalyan to CSMT, or Thane to Dadar)
            if (cIdxOrig !== -1 && cIdxDest !== -1) {
                return [buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, cIdxDest)];
            }

            // 3. SAME HARBOUR LINE (e.g. Panvel to CSMT / Vashi)
            if (hIdxOrig !== -1 && hIdxDest !== -1) {
                return [buildStationSlice(HARBOUR_CORRIDOR_NAMES, hIdxOrig, hIdxDest)];
            }

            // 4. CENTRAL LINE to WESTERN LINE / SOUTH MUMBAI
            if (cIdxOrig !== -1 && (wIdxDest !== -1 || isDestSouth)) {
                // Route A (Dadar Interchange - Standard Google Maps route)
                const pathA = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, dadarCIdx);
                const targetWIdx = wIdxDest !== -1 ? wIdxDest : churchgateWIdx;
                if (dadarWIdx !== targetWIdx) {
                    const stepW = dadarWIdx < targetWIdx ? 1 : -1;
                    const wSlice = buildStationSlice(WESTERN_CORRIDOR_NAMES, dadarWIdx + stepW, targetWIdx);
                    pathA.push(...wSlice);
                }
                if (wIdxDest === -1) {
                    pathA.push(destCoords);
                }

                // Route B (CSMT + Taxi alternative for South Mumbai)
                const pathB = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, csmtCIdx);
                pathB.push(destCoords);

                return [pathA, pathB];
            }

            // 5. CENTRAL LINE to WESTERN SUBURBS (e.g. Kalyan/Thane to Andheri / Borivali)
            if (cIdxOrig !== -1 && wIdxDest !== -1) {
                const isAndheri = destLower.includes('andheri') || destLower.includes('versova');
                if (isAndheri) {
                    // Metro 1 Route via Ghatkopar
                    const pathMetro = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, ghatCIdx);
                    const ghatMIdx = findStationIndex(METRO_LINE_1_NAMES, "Ghatkopar");
                    const andhMIdx = findStationIndex(METRO_LINE_1_NAMES, "Andheri");
                    pathMetro.push(...buildStationSlice(METRO_LINE_1_NAMES, ghatMIdx - 1, andhMIdx));
                    
                    // Dadar Route fallback
                    const pathDadar = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, dadarCIdx);
                    pathDadar.push(...buildStationSlice(WESTERN_CORRIDOR_NAMES, dadarWIdx - 1, wIdxDest));
                    return [pathMetro, pathDadar];
                }

                // Via Dadar to Borivali / Malad
                const pathA = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, dadarCIdx);
                pathA.push(...buildStationSlice(WESTERN_CORRIDOR_NAMES, dadarWIdx - 1, wIdxDest));
                return [pathA];
            }

            // 6. WESTERN LINE to CENTRAL LINE (e.g. Borivali to Thane / CSMT)
            if (wIdxOrig !== -1 && cIdxDest !== -1) {
                const isCentralNorth = cIdxDest < dadarCIdx;
                const pathA = buildStationSlice(WESTERN_CORRIDOR_NAMES, wIdxOrig, dadarWIdx);
                const stepC = dadarCIdx < cIdxDest ? 1 : -1;
                pathA.push(...buildStationSlice(CENTRAL_CORRIDOR_NAMES, dadarCIdx + stepC, cIdxDest));

                // If traveling from Western Suburbs to Central Suburbs, Metro 1 is great alternative
                if (wIdxOrig <= andheriWIdx && isCentralNorth && cIdxDest <= ghatCIdx) {
                    const pathMetro = buildStationSlice(WESTERN_CORRIDOR_NAMES, wIdxOrig, andheriWIdx);
                    const andhMIdx = findStationIndex(METRO_LINE_1_NAMES, "Andheri");
                    const ghatMIdx = findStationIndex(METRO_LINE_1_NAMES, "Ghatkopar");
                    pathMetro.push(...buildStationSlice(METRO_LINE_1_NAMES, andhMIdx + 1, ghatMIdx));
                    pathMetro.push(...buildStationSlice(CENTRAL_CORRIDOR_NAMES, ghatCIdx - 1, cIdxDest));
                    return [pathA, pathMetro];
                }

                return [pathA];
            }

            // 7. HARBOUR LINE to CENTRAL / WESTERN / SOUTH
            if (hIdxOrig !== -1) {
                if (cIdxDest !== -1) {
                    const path = buildStationSlice(HARBOUR_CORRIDOR_NAMES, hIdxOrig, kurlaHIdx);
                    const stepC = kurlaCIdx < cIdxDest ? 1 : -1;
                    path.push(...buildStationSlice(CENTRAL_CORRIDOR_NAMES, kurlaCIdx + stepC, cIdxDest));
                    return [path];
                }
                if (wIdxDest !== -1 || isDestSouth) {
                    const path = buildStationSlice(HARBOUR_CORRIDOR_NAMES, hIdxOrig, csmtHIdx);
                    path.push(destCoords);
                    return [path];
                }
            }

            // 8. TRANSIT TO NON-RAIL HUBS
            // 8A. To Bandra Kurla Complex (BKC)
            if (isDestBKC) {
                if (wIdxOrig !== -1) {
                    const path = buildStationSlice(WESTERN_CORRIDOR_NAMES, wIdxOrig, bandraWIdx);
                    path.push(destCoords);
                    return [path];
                }
                if (cIdxOrig !== -1) {
                    const path = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, kurlaCIdx);
                    path.push(destCoords);
                    return [path];
                }
                if (hIdxOrig !== -1) {
                    const path = buildStationSlice(HARBOUR_CORRIDOR_NAMES, hIdxOrig, kurlaHIdx);
                    path.push(destCoords);
                    return [path];
                }
            }

            // 8B. To Powai (Hiranandani)
            if (isDestPowai) {
                if (cIdxOrig !== -1) {
                    const path = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, kanjurCIdx);
                    path.push(destCoords);
                    return [path];
                }
                if (wIdxOrig !== -1) {
                    const path = buildStationSlice(WESTERN_CORRIDOR_NAMES, wIdxOrig, andheriWIdx);
                    const sakiMIdx = findStationIndex(METRO_LINE_1_NAMES, "Saki Naka");
                    const andhMIdx = findStationIndex(METRO_LINE_1_NAMES, "Andheri");
                    path.push(...buildStationSlice(METRO_LINE_1_NAMES, andhMIdx + 1, sakiMIdx));
                    path.push(destCoords);
                    return [path];
                }
            }

            // 8C. To South Mumbai Landmarks (Colaba, Nariman Point, Fort)
            if (isDestSouth) {
                if (wIdxOrig !== -1) {
                    const path = buildStationSlice(WESTERN_CORRIDOR_NAMES, wIdxOrig, churchgateWIdx);
                    path.push(destCoords);
                    return [path];
                }
                if (cIdxOrig !== -1) {
                    const path = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, csmtCIdx);
                    path.push(destCoords);
                    return [path];
                }
                if (hIdxOrig !== -1) {
                    const path = buildStationSlice(HARBOUR_CORRIDOR_NAMES, hIdxOrig, csmtHIdx);
                    path.push(destCoords);
                    return [path];
                }
            }

            // 8D. To Airport (T1 / T2)
            if (isDestAirport) {
                if (wIdxOrig !== -1) {
                    const path = buildStationSlice(WESTERN_CORRIDOR_NAMES, wIdxOrig, santacruzWIdx);
                    path.push(destCoords);
                    return [path];
                }
                if (cIdxOrig !== -1) {
                    const path = buildStationSlice(CENTRAL_CORRIDOR_NAMES, cIdxOrig, ghatCIdx);
                    path.push(destCoords);
                    return [path];
                }
            }

            return null;
        }

        // Generate map data with railway tracks first (No Bhiwandi highway detours!)
        async function fetchMapData(origin, destination, distanceRef) {
            const originCoords = await getCoordinates(origin);
            const destCoords = await getCoordinates(destination);
            
            if (!originCoords || !destCoords) return null;
            
            // 1. Try real Mumbai railway corridor track path FIRST
            const railwayPaths = buildRealRailwayPath(origin, destination, originCoords, destCoords);
            if (railwayPaths && railwayPaths.length > 0 && railwayPaths[0].length >= 2) {
                distanceRef.val = calculatePathKm(railwayPaths[0]);
                return { originCoords, destCoords, latlngsArray: railwayPaths };
            }
            
            // 2. Road / Highway fallback (forces Eastern Express Highway via Thane to avoid Bhiwandi)
            let latlngsArray = [[originCoords, destCoords]];
            try {
                const isKalyanArea = origin.toLowerCase().includes('kalyan') || origin.toLowerCase().includes('dombivli');
                let osrmUrl;
                if (isKalyanArea && destCoords[0] < originCoords[0]) {
                    // Force waypoint through Thane (72.9757, 19.1860) to stay on Eastern Express Highway (EEH)
                    osrmUrl = `https://router.project-osrm.org/route/v1/driving/${originCoords[1]},${originCoords[0]};72.9757,19.1860;${destCoords[1]},${destCoords[0]}?overview=full&geometries=geojson`;
                } else {
                    osrmUrl = `https://router.project-osrm.org/route/v1/driving/${originCoords[1]},${originCoords[0]};${destCoords[1]},${destCoords[0]}?overview=full&geometries=geojson&alternatives=3`;
                }
                
                const osrmRes = await fetch(osrmUrl);
                const osrmData = await osrmRes.json();
                
                if (osrmData.routes && osrmData.routes.length > 0) {
                    const route = osrmData.routes[0];
                    distanceRef.val = (route.distance / 1000).toFixed(1);
                    latlngsArray = osrmData.routes.map(r => r.geometry.coordinates.map(coord => [coord[1], coord[0]]));
                }
            } catch(e) {}
            
            return { originCoords, destCoords, latlngsArray };
        }

        // Draw segmented dynamic route on map with authentic Google Maps styling
        function drawSegmentedMap(mapData, origin, destination, topRouteModes, routeIndex = 0, highlightedSegmentIndex = null, routeInfo = null) {
            if (currentRouteLayer) map.removeLayer(currentRouteLayer);
            if (!mapData) return;

            const originIcon = L.divIcon({

            const destIcon = L.divIcon({

            const marker1 = L.marker(mapData.originCoords, {icon: originIcon}).bindPopup(`<b>Start:</b> ${origin}${mapData.originInsight ? `<br><span style="font-size: 11px; display: block; margin-top: 4px; color: #ef4444;">Live: ${mapData.originInsight}</span>` : ''}`);

            let layers = [marker1, marker2];

            // Render alternative route polylines in subtle dashed gray (Google Maps style)
            if (mapData.latlngsArray && mapData.latlngsArray.length > 1) {
                mapData.latlngsArray.forEach((altLatlngs, aIdx) => {
                    if (aIdx !== (routeIndex % mapData.latlngsArray.length)) {
                        const altLine = L.polyline(altLatlngs, {
                            color: '#94a3b8',
                            weight: 4,
                            opacity: 0.5,
                            dashArray: '8, 8',
                            lineCap: 'round'
                        });
                        layers.unshift(altLine);
                    }
                });
            }

            // Select active route
            let latlngs = mapData.latlngsArray[routeIndex % mapData.latlngsArray.length];
            if (!latlngs || latlngs.length < 2) return;
            
            let boundsToFit = latlngs;

            // Universal Multimodal Corridor Segment Splitting & Interchange Rendering
            const hasCentral = topRouteModes.some(m => m.includes('Central'));
            const hasWestern = topRouteModes.some(m => m.includes('Western'));
            const hasHarbour = topRouteModes.some(m => m.includes('Harbour'));
            const hasMetro = topRouteModes.some(m => m.includes('Metro'));
            const hasRoad = topRouteModes.some(m => m.includes('Taxi') || m.includes('Auto') || m.includes('Uber'));

            // Key Mumbai Interchange Nodes in Polyline
            const dadarIdx = latlngs.findIndex(pt => Math.abs(pt[0] - 19.0178) < 0.007 && Math.abs(pt[1] - 72.8478) < 0.007);
            const ghatIdx = latlngs.findIndex(pt => Math.abs(pt[0] - 19.0864) < 0.006 && Math.abs(pt[1] - 72.9081) < 0.006);
            const andheriIdx = latlngs.findIndex(pt => Math.abs(pt[0] - 19.1197) < 0.006 && Math.abs(pt[1] - 72.8464) < 0.006);
            const kurlaIdx = latlngs.findIndex(pt => Math.abs(pt[0] - 19.0657) < 0.006 && Math.abs(pt[1] - 72.8793) < 0.006);
            const csmtIdx = latlngs.findIndex(pt => Math.abs(pt[0] - 18.9401) < 0.006 && Math.abs(pt[1] - 72.8354) < 0.006);

            function createTransferMarker(coord, title, subtitle) {
                const icon = L.divIcon({
                    className: 'gmaps-transfer-node',
                    html: `
                        <div class="flex items-center justify-center w-6 h-6 rounded-full bg-white border-2 border-slate-900 shadow-xl cursor-pointer hover:scale-125 transition-transform" title="${title}">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        </div>

                    iconAnchor: [12, 12]

            if (hasCentral && hasWestern && dadarIdx > 0 && dadarIdx < latlngs.length - 1) {

                const seg2 = latlngs.slice(dadarIdx);

                const color1 = isOrigCentral ? '#dc2626' : '#1d4ed8';

                layers.push(L.polyline(seg1, {
                    color: color1,

                }));

                layers.push(createTransferMarker(latlngs[dadarIdx], '🔄 Dadar Interchange', isOrigCentral ? 'Walk ~4 min across FOB from Central Line to Western Line Platform' : 'Walk ~4 min across FOB from Western Line to Central Line Platform'));

                }));

            } else if (hasCentral && hasMetro && ghatIdx > 0 && ghatIdx < latlngs.length - 1) {

            } else if (hasWestern && hasMetro && andheriIdx > 0 && andheriIdx < latlngs.length - 1) {

                const seg1 = latlngs.slice(0, splitIdx + 1);
                const seg2 = latlngs.slice(splitIdx);

                const railColor = hasCentral ? '#dc2626' : (hasWestern ? '#1d4ed8' : '#ea580c');

                layers.push(L.polyline(seg1, {

                                </div>
                                <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 shadow-sm">
                                    <p class="text-[10px] text-slate-500 uppercase font-black tracking-wider">Speed Advantage</p>
                                    <p class="font-bold text-cyan-300 mt-0.5">Faster vs Hwy</p>
                                </div>
                                <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 shadow-sm">
                                    <p class="text-[10px] text-slate-500 uppercase font-black tracking-wider">CO₂ Saved</p>
                                    <p class="font-bold text-emerald-400 mt-0.5">🌱 ${route.co2_saved_kg || 4.2} kg</p>
                                </div>
                                <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 shadow-sm">
                                    <p class="text-[10px] text-slate-500 uppercase font-black tracking-wider">Rush Factor</p>
                                    <p class="font-bold ${route.crowd === 'High' ? 'text-amber-400' : 'text-emerald-400'} mt-0.5">${route.crowd} Crowd</p>
                                </div>
                            </div>

                            <!-- Upcoming Trains Countdown Strip -->
                            ${nextTrainsHtml}

                            <!-- Expandable Turn-by-Turn Itinerary Details -->
                            <div class="itinerary-steps hidden mt-4 pt-4 border-t border-slate-800 space-y-3">
                                <p class="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-2">Turn-by-Turn Directions</p>
                                <div class="space-y-3 bg-slate-950/50 p-3.5 rounded-xl border border-slate-800">
                                    ${stepsHtml}
                                </div>
                                
                                <!-- M-Indicator Segment Progression Bar -->
                                <div class="pt-2">
                                    <p class="text-[10px] text-slate-500 uppercase font-bold mb-1.5">Segment Inspector (Click to isolate on map):</p>
                                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 custom-scrollbar">
                                        ${timelineBlocks}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    // Details expander toggle
                    const detailsBtn = card.querySelector('.toggle-steps-btn');
                    const stepsDiv = card.querySelector('.itinerary-steps');
                    const arrowIcon = card.querySelector('.arrow-icon');
                    if (detailsBtn && stepsDiv) {
                        detailsBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isHidden = stepsDiv.classList.contains('hidden');
                            if (isHidden) {
                                stepsDiv.classList.remove('hidden');
                                arrowIcon?.classList.add('rotate-180');
                            } else {
                                stepsDiv.classList.add('hidden');
                                arrowIcon?.classList.remove('rotate-180');
                            }
                        });
                    }

                    // Card click handler for map route selection
                    card.firstElementChild.addEventListener('click', (e) => {
                        if (e.target.closest('.toggle-steps-btn') || e.target.closest('.mode-block-click')) return;
                        
                        document.querySelectorAll('.transit-route-card > div').forEach(el => {
                            el.classList.remove('border-cyan-500', 'shadow-[0_0_20px_rgba(6,182,212,0.25)]');
                            el.classList.add('border-slate-700/80');
                        });
                        card.firstElementChild.classList.remove('border-slate-700/80');
                        card.firstElementChild.classList.add('border-cyan-500', 'shadow-[0_0_20px_rgba(6,182,212,0.25)]');
                        
                        drawSegmentedMap(mapData, origin, destination, route.mode_sequence, index, null, route);
                    });

                    // Mode segment click handler for individual leg isolation
                    card.querySelectorAll('.mode-block-click').forEach(block => {
                        block.addEventListener('click', (e) => {
                            e.stopPropagation();
                            
                            document.querySelectorAll('.transit-route-card > div').forEach(el => {
                                el.classList.remove('border-cyan-500', 'shadow-[0_0_20px_rgba(6,182,212,0.25)]');
                                el.classList.add('border-slate-700/80');
                            });
                            card.firstElementChild.classList.remove('border-slate-700/80');
                            card.firstElementChild.classList.add('border-cyan-500', 'shadow-[0_0_20px_rgba(6,182,212,0.25)]');
                            
                            const blockIndex = parseInt(block.getAttribute('data-block-index'));
                            drawSegmentedMap(mapData, origin, destination, route.mode_sequence, index, blockIndex, route);
                        });
                    });

                    container.appendChild(card);
                });

                // Render Google Maps Style Road Comparison Cards (matching uploaded screenshot)
                if (roadComparisons) {
                    const roadHtml = `
                        <div id="roadComparisonsSection" class="mt-5 pt-4 border-t border-slate-800">
                            <div class="flex items-center justify-between mb-3 px-1">
                                <h4 class="text-xs font-black uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                                    <span>🚗</span>
                                    <span>Road & Highway Alternatives (Live Traffic)</span>
                                </h4>
                                <span class="text-[10px] text-red-400 bg-red-950/60 border border-red-800/80 px-2 py-0.5 rounded font-bold">Peak Rush Hour</span>
                            </div>
                            <div class="space-y-2.5">
                                <!-- Bike Taxi Alternative -->
                                <div class="p-3.5 bg-slate-900/60 border border-slate-800 hover:border-slate-700 rounded-xl flex items-center justify-between transition-all">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center text-base border border-amber-500/20">
                                            🏍️
                                        </div>
                                        <div>
                                            <p class="text-xs font-bold text-slate-200">${roadComparisons.bike?.title || 'via Two-Wheeler / Bike Taxi'}</p>
                                            <p class="text-[11px] text-slate-400 mt-0.5">${roadComparisons.bike?.traffic || '🟠 Slow Moving Traffic'}</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm font-black text-amber-400">${roadComparisons.bike?.duration || '1 hr 11 min'}</p>
                                        <p class="text-[11px] text-slate-400 mt-0.5">${roadComparisons.bike?.distance || '56.7 km'} • ${roadComparisons.bike?.cost || '₹180'}</p>
                                    </div>
                                </div>

                                <!-- Personal / Uber Cab Alternative -->
                                <div class="p-3.5 bg-slate-900/60 border border-slate-800 hover:border-slate-700 rounded-xl flex items-center justify-between transition-all">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-lg bg-red-500/10 text-red-400 flex items-center justify-center text-base border border-red-500/20">
                                            🚗
                                        </div>
                                        <div>
                                            <p class="text-xs font-bold text-slate-200">${roadComparisons.cab?.title || 'via Eastern Express Hwy / NH 48'}</p>
                                            <p class="text-[11px] text-slate-400 mt-0.5">${roadComparisons.cab?.traffic || '🔴 Heavy Congestion (Peak Rush)'}</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm font-black text-red-400">${roadComparisons.cab?.duration || '1 hr 21 min'}</p>
                                        <p class="text-[11px] text-slate-400 mt-0.5">${roadComparisons.cab?.distance || '62.1 km'} • ${roadComparisons.cab?.cost || '₹653'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', roadHtml);
                }

                // Respect whichever mode filter tab is active
                applyModeFilter(activeModeFilter);

            } catch (error) {
                container.innerHTML = `
                    <div class="p-5 bg-red-900/20 border border-red-500/40 text-red-400 rounded-xl">
                        <p class="font-bold mb-1">Connection Error</p>
                        <p class="text-sm">${error.message}</p>
                        <p class="text-xs mt-3 opacity-70">Make sure the Flask server is running locally on 127.0.0.1:5000</p>
                    </div>`;
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }
    </style>
</body>
</html>
